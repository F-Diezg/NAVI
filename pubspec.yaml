name: navi
description: "NAVI · portal personal: Canvas UEM, calendario, exámenes y más."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.5.0
  supabase_flutter: ^2.18.3
  table_calendar: ^3.2.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/navi.png"
  adaptive_icon_background: "#101828"
  adaptive_icon_foreground: "assets/icon/navi_foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/navi.png"
    icon_size: 256
