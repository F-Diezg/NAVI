# Compila NAVI para Android (APK) y Windows (zip) en GitHub, sin instalar nada.
# Necesita dos secretos en el repo: SUPABASE_URL y SUPABASE_KEY
# (Settings → Secrets and variables → Actions → New repository secret).
name: Compilar NAVI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar claves de Supabase
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar proyecto
        run: |
          flutter create . --platforms=android,windows --project-name navi --org com.victordiez
          dart run tool/configurar.dart
          flutter pub get
          dart run flutter_launcher_icons
          printf '{"SUPABASE_URL":"%s","SUPABASE_KEY":"%s"}' "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_KEY }}" > config.json
      - name: Analizar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release --dart-define-from-file=config.json
      - uses: actions/upload-artifact@v4
        with:
          name: NAVI-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar claves de Supabase
        shell: bash
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar proyecto
        shell: bash
        run: |
          flutter create . --platforms=android,windows --project-name navi --org com.victordiez
          dart run tool/configurar.dart
          flutter pub get
          dart run flutter_launcher_icons
          printf '{"SUPABASE_URL":"%s","SUPABASE_KEY":"%s"}' "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_KEY }}" > config.json
      - name: Compilar Windows
        run: flutter build windows --release --dart-define-from-file=config.json
      - name: Empaquetar Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath NAVI-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NAVI-windows
          path: NAVI-windows.zip

  # Publica las dos versiones en la página de descargas del repo (Releases),
  # para poder bajar el APK directamente desde el móvil.
  publicar:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Preparar archivos
        run: |
          mv out/NAVI-android/app-release.apk NAVI.apk
          mv out/NAVI-windows/NAVI-windows.zip NAVI-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: NAVI (última versión)
          body: |
            **Android (A54):** toca `NAVI.apk` para descargarlo e instalarlo.
            **Windows:** descarga `NAVI-windows.zip`, descomprímelo y abre `navi.exe`.

            Compilado desde ${{ github.sha }}.
          make_latest: true
          files: |
            NAVI.apk
            NAVI-windows.zip
