# Compila NAVI para Android (APK) y Windows (zip) en GitHub, sin instalar nada.
# Necesita dos secretos en el repo: SUPABASE_URL y SUPABASE_KEY
# (Settings → Secrets and variables → Actions → New repository secret).
name: Compilar NAVI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar proyecto
        run: |
          flutter create . --platforms=android,windows --project-name navi --org com.victordiez
          dart run tool/configurar.dart
          flutter pub get
          dart run flutter_launcher_icons
          printf '{"SUPABASE_URL":"%s","SUPABASE_KEY":"%s"}' "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_KEY }}" > config.json
      - name: Analizar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release --dart-define-from-file=config.json
      - uses: actions/upload-artifact@v4
        with:
          name: NAVI-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar proyecto
        shell: bash
        run: |
          flutter create . --platforms=android,windows --project-name navi --org com.victordiez
          dart run tool/configurar.dart
          flutter pub get
          dart run flutter_launcher_icons
          printf '{"SUPABASE_URL":"%s","SUPABASE_KEY":"%s"}' "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_KEY }}" > config.json
      - name: Compilar Windows
        run: flutter build windows --release --dart-define-from-file=config.json
      - uses: actions/upload-artifact@v4
        with:
          name: NAVI-windows
          path: build/windows/x64/runner/Release/
